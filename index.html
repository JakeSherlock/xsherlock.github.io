<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacob Sherlock | Technical Animator & Rigger</title>
    <!-- Favicon Configuration -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">

    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #141416;
            --border-color: #27272a;
            --accent-color: #00ffcc;
            --text-color: #e4e4e7;
            --hotbar-height: 56px;
        }

        /* Lock the root window from scrolling */
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh; /* Dynamic Viewport Height for mobile browsers */
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: monospace, sans-serif;
            box-sizing: border-box;
        }

        /* Fixed Top Hotbar Frame */
        .hotbar {
            height: var(--hotbar-height);
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            box-sizing: border-box;
        }

        .hotbar .brand {
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .hotbar nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 1.25rem;
            font-size: 0.9rem;
            transition: color 0.15s ease;
        }

        .hotbar nav a:hover {
            color: var(--accent-color);
        }

        /* Internal Scrollable Viewport */
        .app-view {
            height: calc(100dvh - var(--hotbar-height));
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; /* Smooth momentum scrolling on iOS */
            padding: 2rem 1.5rem;
            box-sizing: border-box;
        }

        /* Inner Content Frame */
        .content-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* --- Mobile Adjustments --- */
        @media (max-width: 640px) {
            .hotbar {
                padding: 0 1rem;
            }

            .hotbar .brand {
                font-size: 0.85rem;
            }

            .hotbar nav a {
                margin-left: 0.75rem;
                font-size: 0.8rem;
            }

            .app-view {
                padding: 1.25rem 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Fixed App Hotbar -->
    <header class="hotbar">
        <div class="brand">JACOB SHERLOCK</div>
        <nav>
            <a href="#reel">REEL</a>
            <a href="#about">ABOUT</a>
            <a href="#resume">RESUME</a>
        </nav>
    </header>

    <!-- Internal Scroll Frame -->
    <main class="app-view">
        <div class="content-container">
            <section id="reel">
                <!-- Video Reel Container & Breakdown Details go here -->
            </section>
        </div>
    </main>

</body>
</html>
